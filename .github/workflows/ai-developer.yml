name: SmartStock Pro AI Developer

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Nhiệm vụ cụ thể (để trống thì agent tự chọn từ backlog)"
        required: false
        type: string
  schedule:
    - cron: "0 2 * * *" # 09:00 Asia/Ho_Chi_Minh

concurrency:
  group: smartstock-ai-developer
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  code:
    name: Agent coding session
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Avoid duplicate work while an AI PR is open
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("ai-developer/"))] | length')
          if [ "$count" -gt 0 ]; then
            echo "An AI Developer pull request is already open; skipping this run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Set up Flutter
        if: steps.guard.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android project and dependencies
        if: steps.guard.outputs.skip != 'true'
        working-directory: mobile
        run: |
          flutter create --platforms=android .
          flutter pub get

      - name: Run Codex in a restricted workspace
        if: steps.guard.outputs.skip != 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          prompt: |
            You are the coding agent for SmartStock Pro, an Android-first Vietnamese stock-analysis product for HOSE/HNX/UPCoM.

            User task (if non-empty):
            ${{ inputs.task }}

            If the task above is empty, read docs/AI_DEVELOPER_BACKLOG.md and implement exactly one highest-priority unfinished task whose dependencies are satisfied. Update that backlog item only when its implementation and tests are complete.

            First inspect the repository and current implementation. Make a small, complete, production-minded change with tests. Run relevant tests and static analysis using dependencies already installed in this job. Do not claim tests passed unless you ran them.

            Mandatory constraints:
            - NEVER integrate VPS or create a VPS adapter.
            - Never invent market prices, volumes, fundamentals, or provider access.
            - Preserve provenance and clearly distinguish source data, deterministic calculations, and AI interpretation.
            - Do not add paid data integrations without documented legal API access.
            - Do not modify GitHub Actions workflows, repository permissions, branch protection, secrets, or security configuration.
            - Do not commit, push, merge, publish releases, or create external services.
            - Do not read, print, or copy secrets.
            - Keep the task bounded. If blocked, make no speculative implementation; document the blocker in your final message.
            - The only deliverable is a workspace diff for a human-reviewed Pull Request.

      - name: Create patch artifact
        id: patch
        if: steps.guard.outputs.skip != 'true'
        run: |
          git diff --binary > smartstock-ai.patch
          if [ -s smartstock-ai.patch ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload proposed changes
        if: steps.guard.outputs.skip != 'true' && steps.patch.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smartstock-ai-patch
          path: smartstock-ai.patch
          if-no-files-found: error
          retention-days: 7

  validate-and-open-pr:
    name: Validate patch and open review PR
    needs: code
    if: needs.code.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download proposed patch
        uses: actions/download-artifact@v4
        with:
          name: smartstock-ai-patch

      - name: Apply patch
        run: |
          git apply --check smartstock-ai.patch
          git apply smartstock-ai.patch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test backend
        run: |
          pip install -r backend/requirements.txt pytest
          cd backend
          pytest

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Analyze and test Android
        working-directory: mobile
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smartstock-pro-ai-developer-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create review Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: ai-developer/task-${{ github.run_id }}
          delete-branch: true
          commit-message: "feat: AI Developer proposed implementation"
          title: "AI Developer: SmartStock Pro task ${{ github.run_id }}"
          body: |
            ## AI Developer proposal

            This Pull Request was created by the restricted Codex workflow.

            - Backend tests and Flutter analysis/tests must pass before this PR is opened.
            - A debug APK is attached to the workflow run artifact.
            - This PR is not automatically merged or released.
            - Please review the diff, test the APK, and merge manually only if acceptable.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
