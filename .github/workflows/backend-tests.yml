name: SmartStock Pro CI
on:
  push:
    branches: [main]
    paths: ["backend/**", "mobile/**", "docker-compose.yml", ".github/workflows/**"]
  pull_request:
    branches: ["**"]
    paths: ["backend/**", "mobile/**", "docker-compose.yml", ".github/workflows/**"]
concurrency:
  group: smartstock-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest httpx
      - name: Run PR25 migration hardening selection (pass 1)
        run: cd backend && pytest -q tests/test_training_review.py -k "pr25_event_rebuild or pr25_upgrade_fixture"
      - name: Run PR25 migration hardening selection (pass 2)
        run: cd backend && pytest -q tests/test_training_review.py -k "pr25_event_rebuild or pr25_upgrade_fixture"
      - name: Run full Backend test suite
        run: cd backend && pytest

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
      - name: Generate Android platform files
        working-directory: mobile
        run: flutter create --platforms=android .
      - name: Allow local HTTP only in debug builds
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/debug
          cat > android/app/src/debug/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:usesCleartextTraffic="true" />
          </manifest>
          EOF
      - name: Set Android compile SDK
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK root is not configured."
            exit 1
          fi
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter code
        working-directory: mobile
        run: flutter analyze
      - name: Run Training Room session 32 acceptance tests
        working-directory: mobile
        run: flutter test test/training_room_session32_test.dart --reporter expanded
      - name: Run focused Training Review reliability suite (pass 1)
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smartstock-focused"
          failed=0
          for test_file in \
            test/training_review_reliability_session23_test.dart \
            test/training_review_reliability_session25_test.dart \
            test/training_review_reliability_session26_test.dart; do
            log="$RUNNER_TEMP/smartstock-focused/pass-1-$(basename "$test_file").log"
            echo "=== FOCUSED PASS 1: $test_file ==="
            set +e
            flutter test "$test_file" --reporter expanded 2>&1 | tee "$log"
            test_status=${PIPESTATUS[0]}
            set -e
            printf 'EXIT_CODE=%s\n' "$test_status" | tee -a "$log"
            if [ "$test_status" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Run focused Training Review reliability suite (pass 2)
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smartstock-focused"
          failed=0
          for test_file in \
            test/training_review_reliability_session23_test.dart \
            test/training_review_reliability_session25_test.dart \
            test/training_review_reliability_session26_test.dart; do
            log="$RUNNER_TEMP/smartstock-focused/pass-2-$(basename "$test_file").log"
            echo "=== FOCUSED PASS 2: $test_file ==="
            set +e
            flutter test "$test_file" --reporter expanded 2>&1 | tee "$log"
            test_status=${PIPESTATUS[0]}
            set -e
            printf 'EXIT_CODE=%s\n' "$test_status" | tee -a "$log"
            if [ "$test_status" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Upload focused reliability logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-review-focused-reliability-logs
          path: ${{ runner.temp }}/smartstock-focused/*.log
          if-no-files-found: warn
      - name: Run full Flutter test suite
        working-directory: mobile
        run: flutter test
      - name: Build debug APK (retry transient Gradle repository failures)
        working-directory: mobile
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Android APK build attempt $attempt/3"
            if flutter build apk --debug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting 20 seconds before retrying dependency resolution."
              sleep 20
            fi
          done
          echo "APK build failed after 3 attempts."
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: smartstock-pro-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
