services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      SMARTSTOCK_DB_PATH: /data/smartstock.db
      SMARTSTOCK_ENV: ${SMARTSTOCK_ENV:-development}
      SMARTSTOCK_API_TOKEN: ${SMARTSTOCK_API_TOKEN:-}
    volumes:
      - smartstock_data:/data
    restart: unless-stopped

volumes:
  smartstock_data:
